name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Selezione Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Pulisci Configurazione Firma nel Progetto
        run: |
          sed -i '' 's/CODE_SIGN_IDENTITY = ".*";/CODE_SIGN_IDENTITY = "";/g' FreeFCC.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;//g' FreeFCC.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = .*;//g' FreeFCC.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = .*;//g' FreeFCC.xcodeproj/project.pbxproj

      - name: Compilazione Senza Firma
        run: |
          mkdir -p $HOME/build
          xcodebuild build \
            -project FreeFCC.xcodeproj \
            -scheme FreeFCC \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath $HOME/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Pacchettizzazione IPA
        run: |
          mkdir -p $HOME/build/Payload
          APP_PATH=$(find $HOME/build/DerivedData -name "FreeFCC.app" -type d | head -n 1)
          echo "App trovata in: $APP_PATH"
          cp -r "$APP_PATH" $HOME/build/Payload/
          cd $HOME/build
          zip -r DJI-FCC-Unlock.ipa Payload

      - name: Caricamento Artefatto (IPA)
        uses: actions/upload-artifact@v4
        with:
          name: DJI-FCC-Unlock-Unsigned
          path: $HOME/build/DJI-FCC-Unlock.ipa
