name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Selezione Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Pulizia Build
        run: xcodebuild clean -project FreeFCC.xcodeproj -scheme FreeFCC

      - name: Compilazione FreeFCC (Ad-Hoc Signing)
        run: |
          mkdir -p $HOME/build
          xcodebuild build \
            -project FreeFCC.xcodeproj \
            -scheme FreeFCC \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath $HOME/build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Pacchettizzazione IPA
        run: |
          mkdir -p $HOME/build/Payload
          APP_PATH=$(find $HOME/build/DerivedData -name "FreeFCC.app" -type d | head -n 1)
          echo "App trovata in: $APP_PATH"
          cp -r "$APP_PATH" $HOME/build/Payload/
          cd $HOME/build
          zip -r DJI-FCC-Unlock.ipa Payload

      - name: Caricamento Artefatto (IPA)
        uses: actions/upload-artifact@v4
        with:
          name: DJI-FCC-Unlock-Unsigned
          path: $HOME/build/DJI-FCC-Unlock.ipa
