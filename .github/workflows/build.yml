name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Selezione Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Svuota e ricrea Assets per evitare il crash di actool
        run: |
          find . -name "Assets.xcassets" -exec rm -rf {} +
          mkdir -p FreeFCC/Resources/Assets.xcassets
          echo '{"info" : {"author" : "xcode", "version" : 1}}' > FreeFCC/Resources/Assets.xcassets/Contents.json

      - name: Compilazione FreeFCC Definitiva
        run: |
          xcodebuild build \
            -project FreeFCC.xcodeproj \
            -scheme FreeFCC \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Generazione IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./DerivedData -name "FreeFCC.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r DJI-FCC-Unlock.ipa Payload

      - name: Caricamento Artefatto (IPA)
        uses: actions/upload-artifact@v4
        with:
          name: DJI-FCC-Unlock-Unsigned
          path: DJI-FCC-Unlock.ipa
