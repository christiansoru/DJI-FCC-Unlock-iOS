name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Selezione Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Pulisci Configurazione e Asset
        run: |
          sed -i '' 's/CODE_SIGN_IDENTITY = ".*";/CODE_SIGN_IDENTITY = "";/g' FreeFCC.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;//g' FreeFCC.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = .*;//g' FreeFCC.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = .*;//g' FreeFCC.xcodeproj/project.pbxproj

      - name: Compilazione Diretta Senza Assets Catalog
        run: |
          mkdir -p $HOME/build
          xcodebuild build \
            -project FreeFCC.xcodeproj \
            -scheme FreeFCC \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath $HOME/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME="" \
            DISABLE_ASSET_COMPILATION=YES || true

      - name: Forzare pacchettizzazione manuale del binario
        run: |
          mkdir -p $HOME/build/Payload
          APP_PATH=$(find $HOME/build/DerivedData -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Tentativo di compilazione fallito, ricerca binario alternativo..."
            xcodebuild -project FreeFCC.xcodeproj -scheme FreeFCC -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=NO COMPILER_INDEX_STORE_ENABLE=NO
            APP_PATH=$(find build/ -name "*.app" -type d | head -n 1)
          fi
          echo "App trovata in: $APP_PATH"
          cp -r "$APP_PATH" $HOME/build/Payload/
          cd $HOME/build
          zip -r DJI-FCC-Unlock.ipa Payload

      - name: Caricamento Artefatto (IPA)
        uses: actions/upload-artifact@v4
        with:
          name: DJI-FCC-Unlock-Unsigned
          path: $HOME/build/DJI-FCC-Unlock.ipa
