name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Selezione versione Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Installazione CocoaPods (se presente)
        run: |
          if [ -f "Podfile" ]; then
            echo "Podfile trovato, eseguo pod install..."
            pod install
          fi

      - name: Compilazione senza firma (Fix Exit Code 74)
        run: |
          mkdir -p $HOME/build
          
          if [ -d *.xcworkspace ]; then
            WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
            SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | jq -r '.workspace.schemes[0]')
            xcodebuild archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -sdk iphoneos \
              -configuration Release \
              -archivePath $HOME/build/app.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            PROJECT=$(ls -d *.xcodeproj | head -n 1)
            SCHEME=$(xcodebuild -project "$PROJECT" -list -json | jq -r '.project.schemes[0]')
            xcodebuild archive \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -sdk iphoneos \
              -configuration Release \
              -archivePath $HOME/build/app.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Generazione pacchetto IPA
        run: |
          mkdir -p $HOME/build/Payload
          cp -r $HOME/build/app.xcarchive/Products/Applications/*.app $HOME/build/Payload/
          cd $HOME/build
          zip -r DJI-FCC-Unlock.ipa Payload

      - name: Salvataggio Artefatto (IPA)
        uses: actions/upload-artifact@v4
        with:
          name: DJI-FCC-Unlock-Unsigned
          path: $HOME/build/DJI-FCC-Unlock.ipa
