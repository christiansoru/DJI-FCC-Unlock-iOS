name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Selezione Xcode 15.2 (Stabile e completo)
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Compilazione FreeFCC
        run: |
          xcodebuild build \
            -project FreeFCC.xcodeproj \
            -scheme FreeFCC \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Generazione IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./DerivedData -name "FreeFCC.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r DJI-FCC-Unlock.ipa Payload

      - name: Caricamento Artefatto (IPA)
        uses: actions/upload-artifact@v4
        with:
          name: DJI-FCC-Unlock-Unsigned
          path: DJI-FCC-Unlock.ipa
