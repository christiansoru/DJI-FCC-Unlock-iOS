name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Selezione versione Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Compilazione Archivio
        run: |
          mkdir -p $HOME/build
          xcodebuild archive \
            -project *.xcodeproj \
            -scheme $(xcodebuild -list -json | jq -r '.project.schemes[0]') \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $HOME/build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Generazione IPA da Payload
        run: |
          mkdir -p $HOME/build/Payload
          cp -r $HOME/build/app.xcarchive/Products/Applications/*.app $HOME/build/Payload/
          cd $HOME/build
          zip -r DJI-FCC-Unlock.ipa Payload

      - name: Salvataggio Artefatto (IPA)
        uses: actions/upload-artifact@v4
        with:
          name: DJI-FCC-Unlock-Unsigned
          path: $HOME/build/DJI-FCC-Unlock.ipa
