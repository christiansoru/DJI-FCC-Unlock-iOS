name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Selezione Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Rimuovi Assets bloccanti (Fix definitivo actool)
        run: |
          find . -name "Assets.xcassets" -exec rm -rf {} + || true

      - name: Compilazione FreeFCC
        run: |
          xcodebuild \
            -project FreeFCC.xcodeproj \
            -scheme FreeFCC \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Generazione IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./DerivedData -name "FreeFCC.app" -type d | head -n 1)
          echo "App trovata in: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r DJI-FCC-Unlock.ipa Payload

      - name: Caricamento Artefatto (IPA)
        uses: actions/upload-artifact@v4
        with:
          name: DJI-FCC-Unlock-Unsigned
          path: DJI-FCC-Unlock.ipa
